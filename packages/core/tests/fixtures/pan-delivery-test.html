<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>PAN delivery/lifecycle regression fixture</title>
  <script type="module">
    // ?bus=<module url>&client=<module url>&tag=<bus element tag>
    // Loads one bus/client variant so the same regression tests can run against all of them.
    const q = new URLSearchParams(location.search);
    const busUrl = q.get('bus');
    const clientUrl = q.get('client') || busUrl;
    const tag = q.get('tag') || 'pan-bus';
    await import(busUrl);
    const mod = await import(clientUrl);
    window.PanClient = mod.PanClient || mod.default;
    const bus = document.createElement(tag);
    bus.id = 'test-bus';
    document.body.prepend(bus);
    window.__bus = bus;
    window.__testReady = true;
  </script>
</head>
<body></body>
</html>
